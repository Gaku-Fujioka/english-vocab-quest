<header class="flex justify-between items-center w-full px-safe-margin py-md bg-surface dark:bg-surface-dim docked full-width top-0 sticky z-40">
<button aria-label="Menu" class="text-on-surface-variant dark:text-outline hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center justify-center w-10 h-10 rounded-full">

<h1 class="font-display-lg text-display-lg font-bold text-primary dark:text-primary-fixed-dim tracking-tight">VocabMaster</h1>

</button>

<p class="font-body-md text-body-md text-on-surface-variant">学習目標とデータの管理</p>

<h3 class="font-label-bold text-label-bold text-outline uppercase tracking-wider">目標スコア</h3>
<div class="bg-surface-lowest rounded-xl shadow-level-1 overflow-hidden divide-y divide-surface-variant">

<span class="font-body-lg text-body-lg text-on-surface font-medium group-hover:text-primary transition-colors">TOEIC 600</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">初級</span>
</div>
<input class="w-5 h-5 border-outline focus:ring-primary focus:ring-2" name="toeic_goal" type="radio" value="600"/>
</label>
<label class="flex items-center justify-between p-md cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="flex flex-col">
<span class="font-body-lg text-body-lg text-on-surface font-medium group-hover:text-primary transition-colors">TOEIC 730</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">中級</span>
</div>
<input checked="" class="w-5 h-5 border-outline focus:ring-primary focus:ring-2" name="toeic_goal" type="radio" value="730"/>
</label>
<label class="flex items-center justify-between p-md cursor-pointer hover:bg-surface-container-low transition-colors group">

</div>

<span class="font-body-lg text-body-lg text-on-surface font-medium group-hover:text-primary transition-colors">TOEIC 950</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">マスター</span>
</div>
<input class="w-5 h-5 border-outline focus:ring-primary focus:ring-2" name="toeic_goal" type="radio" value="950"/>
</label>
</div>

<button class="w-full flex items-center justify-between p-md hover:bg-surface-container-low transition-colors text-left active:bg-surface-container">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 0;">download</span>

</div>

</button>

</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
</div>
</section>

</div>
